<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Dashboard - Bloomberg Terminal Style</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e14;
            --bg-panel: #0f1419;
            --border-color: #1a1f2e;
            --text-primary: #d4d4d4;
            --text-secondary: #8b92a0;
            --green: #00ff88;
            --red: #ff4444;
            --yellow: #ffaa00;
            --blue: #0099ff;
            --purple: #cc66ff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Courier New', 'Consolas', monospace;
            font-size: 12px;
            overflow: hidden;
            height: 100vh;
        }

        /* Header */
        #header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 45px;
            flex-shrink: 0;
        }

        .header-indices {
            display: flex;
            gap: 20px;
            flex: 1;
        }

        .index-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }

        .index-name {
            color: var(--text-secondary);
            min-width: 40px;
        }

        .index-price {
            font-weight: bold;
            min-width: 70px;
        }

        .index-change {
            min-width: 60px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--red);
            animation: blink 1s infinite;
        }

        .status-indicator.active {
            background-color: var(--green);
            animation: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Container */
        #container {
            display: flex;
            height: calc(100vh - 45px);
            gap: 0;
        }

        /* Watchlist Sidebar */
        #watchlist {
            width: 180px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .watchlist-title {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .watchlist-items {
            flex: 1;
            overflow-y: auto;
            border-bottom: 1px solid var(--border-color);
        }

        .watchlist-item {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 11px;
        }

        .watchlist-item:hover {
            background-color: #1a1f2e;
        }

        .watchlist-item.active {
            background-color: #1a3a3a;
            border-left: 2px solid var(--green);
            padding-left: 8px;
        }

        .stock-code {
            font-weight: bold;
            color: var(--text-primary);
            display: block;
        }

        .stock-name {
            color: var(--text-secondary);
            font-size: 10px;
            margin-top: 2px;
        }

        .stock-price {
            display: flex;
            justify-content: space-between;
            margin-top: 3px;
            font-size: 10px;
        }

        .stock-change {
            font-weight: bold;
        }

        .watchlist-input {
            padding: 8px 10px;
            display: flex;
            gap: 4px;
            border-top: 1px solid var(--border-color);
        }

        #addSymbolInput {
            flex: 1;
            background-color: #1a1f2e;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 4px;
            font-family: inherit;
            font-size: 10px;
        }

        #addSymbolBtn {
            padding: 4px 6px;
            background-color: #1a3a3a;
            border: 1px solid var(--green);
            color: var(--green);
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
        }

        #addSymbolBtn:hover {
            background-color: #1a5a4a;
        }

        /* Main Content Area */
        #mainContent {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Chart Container */
        #chartContainer {
            flex: 1;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chart-controls {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            background-color: var(--bg-dark);
        }

        .control-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .control-label {
            color: var(--text-secondary);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        button.period-btn, button.indicator-btn {
            padding: 4px 8px;
            background-color: #1a1f2e;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
        }

        button.period-btn:hover, button.indicator-btn:hover {
            background-color: #252d3a;
            border-color: var(--text-primary);
        }

        button.period-btn.active, button.indicator-btn.active {
            background-color: var(--green);
            color: var(--bg-dark);
            border-color: var(--green);
        }

        #chart {
            flex: 1;
            min-height: 250px;
        }

        #indicatorChart {
            height: 120px;
            border-top: 1px solid var(--border-color);
        }

        /* Bottom Panels */
        #bottomPanel {
            height: 200px;
            background-color: var(--bg-panel);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-top: 1px solid var(--border-color);
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            overflow-x: auto;
            padding: 0 12px;
        }

        .tab {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--green);
            border-bottom-color: var(--green);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            display: none;
            padding: 10px 12px;
        }

        .tab-content.active {
            display: block;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
        }

        .data-table thead {
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background-color: var(--bg-dark);
        }

        .data-table th {
            padding: 6px 8px;
            text-align: left;
            color: var(--text-secondary);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .data-table tr:hover {
            background-color: #1a1f2e;
        }

        .positive {
            color: var(--green);
            font-weight: bold;
        }

        .negative {
            color: var(--red);
            font-weight: bold;
        }

        .neutral {
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            #watchlist {
                width: 140px;
            }

            .header-indices {
                gap: 12px;
            }

            .index-price, .index-change {
                min-width: 50px;
                font-size: 10px;
            }
        }

        @media (max-width: 768px) {
            #container {
                flex-direction: column;
            }

            #watchlist {
                width: 100%;
                height: 150px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .watchlist-items {
                display: flex;
                overflow-x: auto;
                border-bottom: none;
                flex-direction: row;
            }

            .watchlist-item {
                min-width: 120px;
                border-right: 1px solid var(--border-color);
                border-bottom: none;
            }

            #mainContent {
                flex-direction: row;
                gap: 0;
            }

            #chartContainer {
                flex: 1;
                border-bottom: none;
                border-right: 1px solid var(--border-color);
            }

            #bottomPanel {
                height: auto;
                width: 200px;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header">
        <div class="header-indices">
            <div class="index-item">
                <span class="index-name">上证</span>
                <span class="index-price" id="idx-shanghai">--</span>
                <span class="index-change" id="idx-shanghai-change">--</span>
            </div>
            <div class="index-item">
                <span class="index-name">深证</span>
                <span class="index-price" id="idx-shenzhen">--</span>
                <span class="index-change" id="idx-shenzhen-change">--</span>
            </div>
            <div class="index-item">
                <span class="index-name">创业板</span>
                <span class="index-price" id="idx-gem">--</span>
                <span class="index-change" id="idx-gem-change">--</span>
            </div>
        </div>
        <div class="header-right">
            <div>
                <span id="currentTime">--:--:--</span>
            </div>
            <div>
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">离线</span>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div id="container">
        <!-- Watchlist Sidebar -->
        <div id="watchlist">
            <div class="watchlist-title">关注列表</div>
            <div class="watchlist-items" id="watchlistItems"></div>
            <div class="watchlist-input">
                <input type="text" id="addSymbolInput" placeholder="输入代码">
                <button id="addSymbolBtn">+</button>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent">
            <!-- Chart Container -->
            <div id="chartContainer">
                <div class="chart-controls">
                    <div class="control-group">
                        <span class="control-label">周期</span>
                        <button class="period-btn active" data-period="1min">分时</button>
                        <button class="period-btn" data-period="5min">5分</button>
                        <button class="period-btn" data-period="15min">15分</button>
                        <button class="period-btn" data-period="day">日K</button>
                        <button class="period-btn" data-period="week">周K</button>
                        <button class="period-btn" data-period="month">月K</button>
                    </div>
                    <div class="control-group">
                        <span class="control-label">指标</span>
                        <button class="indicator-btn active" data-indicator="macd">MACD</button>
                        <button class="indicator-btn" data-indicator="kdj">KDJ</button>
                        <button class="indicator-btn" data-indicator="rsi">RSI</button>
                        <button class="indicator-btn" data-indicator="boll">BOLL</button>
                    </div>
                </div>
                <div id="chart"></div>
                <div id="indicatorChart"></div>
            </div>

            <!-- Bottom Panel -->
            <div id="bottomPanel">
                <div class="tabs">
                    <button class="tab active" data-tab="moneyflow">资金流向</button>
                    <button class="tab" data-tab="northbound">北向资金</button>
                    <button class="tab" data-tab="dragontiger">龙虎榜</button>
                    <button class="tab" data-tab="blocktrade">大宗交易</button>
                    <button class="tab" data-tab="finance">财务分析</button>
                    <button class="tab" data-tab="announcements">公告</button>
                    <button class="tab" data-tab="news">新闻</button>
                    <button class="tab" data-tab="ipo">新股</button>
                    <button class="tab" data-tab="gdhs">散户集中</button>
                </div>
                <div id="tab-moneyflow" class="tab-content active">
                    <div class="loading">加载中...</div>
                </div>
                <div id="tab-northbound" class="tab-content">
                    <div class="loading">加载中...</div>
                </div>
                <div id="tab-dragontiger" class="tab-content">
                    <div class="loading">加载中...</div>
                </div>
                <div id="tab-blocktrade" class="tab-content">
                    <div class="loading">加载中...</div>
                </div>
                <div id="tab-finance" class="tab-content">
                    <div class="loading">加载中...</div>
                </div>
                <div id="tab-announcements" class="tab-content">
                    <div class="loading">加载中...</div>
                </div>
                <div id="tab-news" class="tab-content">
                    <div class="loading">加载中...</div>
                </div>
                <div id="tab-ipo" class="tab-content">
                    <div class="loading">加载中...</div>
                </div>
                <div id="tab-gdhs" class="tab-content">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>


    <script>
        // Configuration
        const API = '';
        const DEFAULT_STOCKS = [
            { code: '002594', name: '比亚迪' },
            { code: '600036', name: '招商银行' },
            { code: '601318', name: '中国平安' },
            { code: '688981', name: '中芯国际' },
            { code: '159813', name: '半导体ETF南方' },
            { code: '513120', name: '恒生创新药ETF' }
        ];
        const INDEX_SYMBOLS = ['000001', '399001', '399006'];

        // Global state
        let state = {
            selectedStock: DEFAULT_STOCKS[0],
            currentPeriod: '1min',
            currentIndicator: 'macd',
            watchlist: [],
            klineData: {},
            quotes: {}
        };

        let charts = {
            main: null,
            indicator: null
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadWatchlist();
            renderWatchlist();
            initializeCharts();
            loadIndexData();
            loadQuotes();
            loadKlineData();
            loadTabData('moneyflow');
            updateTime();

            setInterval(updateTime, 1000);
            setInterval(refreshTradingData, 30000);

            // Event listeners
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    state.currentPeriod = e.target.dataset.period;
                    loadKlineData();
                });
            });

            document.querySelectorAll('.indicator-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.indicator-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    state.currentIndicator = e.target.dataset.indicator;
                    drawIndicatorChart();
                });
            });

            document.querySelectorAll('.tab').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const tabName = e.target.dataset.tab;
                    switchTab(tabName);
                });
            });

            document.getElementById('addSymbolBtn').addEventListener('click', addStock);
            document.getElementById('addSymbolInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addStock();
            });
        });

        // Watchlist management
        function loadWatchlist() {
            const saved = localStorage.getItem('watchlist');
            state.watchlist = saved ? JSON.parse(saved) : DEFAULT_STOCKS;
        }

        function saveWatchlist() {
            localStorage.setItem('watchlist', JSON.stringify(state.watchlist));
        }

        function renderWatchlist() {
            const container = document.getElementById('watchlistItems');
            container.innerHTML = '';

            state.watchlist.forEach((stock, idx) => {
                const item = document.createElement('div');
                item.className = 'watchlist-item' + (stock.code === state.selectedStock.code ? ' active' : '');
                item.innerHTML = `
                    <span class="stock-code">${stock.code}</span>
                    <span class="stock-name">${stock.name}</span>
                    <div class="stock-price">
                        <span id="price-${stock.code}">--</span>
                        <span class="stock-change" id="change-${stock.code}">--</span>
                    </div>
                `;
                item.addEventListener('click', () => selectStock(stock));
                container.appendChild(item);
            });
        }

        function selectStock(stock) {
            state.selectedStock = stock;
            renderWatchlist();
            loadKlineData();
            loadTabData(document.querySelector('.tab.active').dataset.tab);
        }

        function addStock() {
            const input = document.getElementById('addSymbolInput');
            const code = input.value.toUpperCase().trim();

            if (!code) return;
            if (state.watchlist.some(s => s.code === code)) {
                alert('已添加该股票');
                return;
            }

            state.watchlist.push({ code, name: code });
            saveWatchlist();
            renderWatchlist();
            input.value = '';
            loadQuotes();
        }

        // Data loading
        function loadIndexData() {
            const symbols = INDEX_SYMBOLS.join(',');
            fetch(`${API}/api/tencent/index/quotes?symbols=${symbols}`)
                .then(r => r.json())
                .then(res => {
                    if (res.code === 200 && res.data && res.data.行情) {
                        const indexMap = {
                            '000001': { el: 'idx-shanghai', elChange: 'idx-shanghai-change' },
                            '399001': { el: 'idx-shenzhen', elChange: 'idx-shenzhen-change' },
                            '399006': { el: 'idx-gem', elChange: 'idx-gem-change' }
                        };

                        res.data.行情.forEach(idx => {
                            const key = idx.指数代码;
                            if (indexMap[key]) {
                                const price = parseFloat(idx.最新价).toFixed(2);
                                const change = parseFloat(idx.涨跌幅).toFixed(2);
                                document.getElementById(indexMap[key].el).textContent = price;

                                const changeEl = document.getElementById(indexMap[key].elChange);
                                changeEl.textContent = (change > 0 ? '+' : '') + change + '%';
                                changeEl.className = change >= 0 ? 'positive' : 'negative';
                            }
                        });
                    }
                })
                .catch(err => console.error('Index data error:', err));
        }

        function loadQuotes() {
            if (state.watchlist.length === 0) return;

            const symbols = state.watchlist.map(s => s.code).join(',');
            fetch(`${API}/api/tencent/stock/quotes?symbols=${symbols}`)
                .then(r => r.json())
                .then(res => {
                    if (res.code === 200 && res.data && res.data.行情) {
                        res.data.行情.forEach(quote => {
                            state.quotes[quote.股票代码] = quote;

                            const priceEl = document.getElementById(`price-${quote.股票代码}`);
                            const changeEl = document.getElementById(`change-${quote.股票代码}`);

                            if (priceEl) {
                                priceEl.textContent = parseFloat(quote.最新价).toFixed(2);
                                changeEl.textContent = (parseFloat(quote.涨跌幅) > 0 ? '+' : '') + parseFloat(quote.涨跌幅).toFixed(2) + '%';
                                changeEl.className = 'stock-change ' + (parseFloat(quote.涨跌幅) >= 0 ? 'positive' : 'negative');
                            }
                        });
                    }
                    updateStatus(true);
                })
                .catch(err => {
                    console.error('Quote loading error:', err);
                    updateStatus(false);
                });
        }

        function loadKlineData() {
            const symbol = state.selectedStock.code;
            const period = state.currentPeriod;
            const count = period === 'day' ? 120 : (period === 'week' ? 60 : (period === 'month' ? 24 : 288));

            fetch(`${API}/api/tencent/kline?symbol=${symbol}&period=${period}&count=${count}`)
                .then(r => r.json())
                .then(res => {
                    if (res.code === 200 && res.data && res.data.K线) {
                        state.klineData[symbol] = res.data.K线;
                        drawMainChart();
                        drawIndicatorChart();
                    }
                })
                .catch(err => console.error('K-line error:', err));
        }

        // Chart initialization
        function initializeCharts() {
            charts.main = echarts.init(document.getElementById('chart'));
            charts.indicator = echarts.init(document.getElementById('indicatorChart'));

            window.addEventListener('resize', () => {
                charts.main.resize();
                charts.indicator.resize();
            });
        }

        // Chart drawing
        function drawMainChart() {
            const symbol = state.selectedStock.code;
            const kdata = state.klineData[symbol];

            if (!kdata || kdata.length === 0) {
                return;
            }

            const isMinutePeriod = ['1min', '5min', '15min'].includes(state.currentPeriod);
            const data = kdata.map(k => [
                new Date(k.日期).getTime(),
                parseFloat(k.开盘),
                parseFloat(k.收盘),
                parseFloat(k.最低),
                parseFloat(k.最高),
                parseInt(k.成交量)
            ]);

            const indicators = calculateIndicators(data);
            const ma5 = indicators.ma5;
            const ma10 = indicators.ma10;
            const ma20 = indicators.ma20;
            const ma60 = indicators.ma60;

            const xAxisData = data.map((_, i) => {
                const date = new Date(data[i][0]);
                return state.currentPeriod === 'day'
                    ? date.toLocaleDateString('zh-CN')
                    : date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            });

            let series = [];

            if (isMinutePeriod) {
                // Line chart for minute data
                series.push({
                    name: '收盘价',
                    type: 'line',
                    data: data.map(d => d[2]),
                    lineStyle: { color: '#fff', width: 1 },
                    itemStyle: { borderWidth: 0 }
                });
            } else {
                // Candlestick for day/week/month
                series.push({
                    name: 'K线',
                    type: 'candlestick',
                    data: data.map(d => [d[1], d[3], d[4], d[2]]),
                    itemStyle: {
                        color: '#00ff88',
                        color0: '#ff4444',
                        borderColor: '#00ff88',

        // Technical indicators calculation
        function calculateIndicators(data) {
            const closes = data.map(d => d[2]);
            const highs = data.map(d => d[4]);
            const lows = data.map(d => d[3]);

            // Moving Averages
            const ma5 = calculateMA(closes, 5);
            const ma10 = calculateMA(closes, 10);
            const ma20 = calculateMA(closes, 20);
            const ma60 = calculateMA(closes, 60);

            // MACD
            const macd = calculateMACD(closes);

            // KDJ
            const kdj = calculateKDJ(highs, lows, closes);

            // RSI
            const rsi = calculateRSI(closes);

            // BOLL
            const boll = calculateBOLL(closes, ma20);

            return { ma5, ma10, ma20, ma60, macd, kdj, rsi, boll };
        }

        function calculateMA(data, period) {
            const ma = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    ma.push(null);
                } else {
                    let sum = 0;
                    for (let j = i - period + 1; j <= i; j++) {
                        sum += data[j];
                    }
                    ma.push(sum / period);
                }
            }
            return ma;
        }

        function calculateEMA(data, period) {
            const ema = [];
            const multiplier = 2 / (period + 1);

            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    ema.push(null);
                } else if (i === period - 1) {
                    let sum = 0;
                    for (let j = 0; j < period; j++) {
                        sum += data[j];
                    }
                    ema.push(sum / period);
                } else {
                    ema.push((data[i] - ema[i - 1]) * multiplier + ema[i - 1]);
                }
            }
            return ema;
        }

        function calculateMACD(closes) {
            const ema12 = calculateEMA(closes, 12);
            const ema26 = calculateEMA(closes, 26);
            const dif = [];
            const dea = [];
            const macd = [];

            for (let i = 0; i < closes.length; i++) {
                if (ema12[i] && ema26[i]) {
                    dif.push(ema12[i] - ema26[i]);
                } else {
                    dif.push(null);
                }
            }

            const deaRaw = calculateEMA(dif.filter(v => v !== null), 9);
            let deaIdx = 0;
            for (let i = 0; i < dif.length; i++) {
                if (dif[i] !== null) {
                    dea.push(deaRaw[deaIdx] || null);
                    deaIdx++;
                } else {
                    dea.push(null);
                }
            }

            for (let i = 0; i < closes.length; i++) {
                if (dif[i] && dea[i]) {
                    macd.push((dif[i] - dea[i]) * 2);
                } else {
                    macd.push(null);
                }
            }

            return { dif, dea, macd };
        }

        function calculateKDJ(highs, lows, closes, period = 9) {
            const k = [];
            const d = [];
            const j = [];
            let lastK = 50;
            let lastD = 50;

            for (let i = 0; i < closes.length; i++) {
                if (i < period - 1) {
                    k.push(null);
                    d.push(null);
                    j.push(null);
                } else {
                    let high = Math.max(...highs.slice(i - period + 1, i + 1));
                    let low = Math.min(...lows.slice(i - period + 1, i + 1));
                    let rsv = high === low ? 0 : (closes[i] - low) / (high - low) * 100;

                    lastK = rsv / 3 + lastK * 2 / 3;
                    lastD = lastK / 3 + lastD * 2 / 3;

                    k.push(lastK);
                    d.push(lastD);
                    j.push(lastK * 3 - lastD * 2);
                }
            }

            return { k, d, j };
        }

        function calculateRSI(closes, period1 = 6, period2 = 12) {
            const rsi = (period) => {
                const result = [];
                for (let i = 0; i < closes.length; i++) {
                    if (i < period) {
                        result.push(null);
                    } else {
                        let gains = 0, losses = 0;
                        for (let j = i - period + 1; j <= i; j++) {
                            const change = closes[j] - closes[j - 1];
                            if (change > 0) gains += change;
                            else losses -= change;
                        }
                        const rs = losses === 0 ? 100 : gains / losses;
                        result.push(100 - (100 / (1 + rs)));
                    }
                }
                return result;
            };

            return { rsi6: rsi(period1), rsi12: rsi(period2) };
        }

        function calculateBOLL(closes, ma20, stdPeriod = 20) {
            const upper = [];
            const middle = [];
            const lower = [];

            for (let i = 0; i < closes.length; i++) {
                if (ma20[i] === null) {
                    upper.push(null);
                    middle.push(null);
                    lower.push(null);
                } else {
                    middle.push(ma20[i]);

                    let sum = 0, sumSq = 0;
                    for (let j = i - stdPeriod + 1; j <= i; j++) {
                        sum += closes[j];
                        sumSq += closes[j] * closes[j];
                    }

                    const avg = sum / stdPeriod;
                    const std = Math.sqrt(sumSq / stdPeriod - avg * avg);

                    upper.push(ma20[i] + 2 * std);
                    lower.push(ma20[i] - 2 * std);
                }
            }

            return { upper, middle, lower };
        }

        function renderGDHSTable(container, data) {
            let html = '<table class="data-table"><thead><tr><th>代码</th><th>名称</th><th>股东户数</th><th>户均持股</th></tr></thead><tbody>';
            data.slice(0, 20).forEach(row => {
                html += `<tr>
                    <td>${row.股票代码}</td>
                    <td>${row.股票名称}</td>
                    <td>${parseInt(row.股东户数 || 0).toLocaleString()}</td>
                    <td>${parseFloat(row.户均持股 || 0).toFixed(2)}股</td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Utilities
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function updateStatus(online) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');

            if (online) {
                indicator.classList.add('active');
                text.textContent = '在线';
            } else {
                indicator.classList.remove('active');
                text.textContent = '离线';
            }
        }

        function isTradingHours() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const weekday = now.getDay();

            // Trading hours: 9:15-15:00 on weekdays
            if (weekday === 0 || weekday === 6) return false;

            const totalMinutes = hours * 60 + minutes;
            return totalMinutes >= 9 * 60 + 15 && totalMinutes <= 15 * 60;
        }

        function refreshTradingData() {
            if (isTradingHours()) {
                loadQuotes();
                loadIndexData();
            }
        }
    </script>
</body>
</html>
